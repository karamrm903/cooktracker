name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Verify Backend Syntax
        run: |
          node --check server/index.js
          node --check server/routes/pipeline.js
          node --check server/routes/aiRecipes.js

      - name: Mobile TypeScript Verification
        run: npm run typecheck:app

      - name: Validate Env Diagnostic Script
        run: node server/scripts/verify-env.js
